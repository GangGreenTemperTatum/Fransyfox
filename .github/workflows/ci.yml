---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Lint Firefox package
        run: npx --yes web-ext lint --source-dir dist/firefox --no-config-discovery
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/chrome
            dist/firefox

  e2e-firefox:
    name: End-to-end (Firefox)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Install Firefox Nightly (release builds enforce add-on signing)
        run: |
          wget -q "https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=linux64&lang=en-US" -O firefox.tar.xz
          mkdir -p "$HOME/firefox"
          tar xf firefox.tar.xz -C "$HOME/firefox" --strip-components=1
          "$HOME/firefox/firefox" --version
      - name: Install geckodriver
        run: |
          VER=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | jq -r .tag_name)
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${VER}/geckodriver-${VER}-linux64.tar.gz"
          tar xzf "geckodriver-${VER}-linux64.tar.gz"
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
      - name: Install Python deps
        run: python3 -m pip install selenium
      - name: Run Firefox e2e
        env:
          FIREFOX_BIN: "$HOME/firefox/firefox"
        run: python3 scripts/e2e/firefox_e2e.py