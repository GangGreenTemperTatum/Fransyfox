name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Lint Firefox package
        run: npx --yes web-ext lint --source-dir dist/firefox --no-config-discovery
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/chrome
            dist/firefox

  e2e-firefox:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Firefox Nightly (release builds enforce add-on signing)
        run: |
          wget -q "https://download.mozilla.org/?product=firefox-nightly-latest-ssl&os=linux64&lang=en-US" -O firefox.tar.xz
          mkdir -p "$HOME/firefox"
          tar xf firefox.tar.xz -C "$HOME/firefox" --strip-components=1
          "$HOME/firefox/firefox" --version
      - name: Install geckodriver
        run: |
          VER=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | jq -r .tag_name)
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${VER}/geckodriver-${VER}-linux64.tar.gz"
          tar xzf "geckodriver-${VER}-linux64.tar.gz"
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version
      - name: Install Python deps
        run: python3 -m pip install selenium
      - name: Run Firefox e2e
        env:
          FIREFOX_BIN: "$HOME/firefox/firefox"
        run: python3 scripts/e2e/firefox_e2e.py